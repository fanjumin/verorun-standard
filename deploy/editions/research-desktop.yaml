# VeroRun 科研桌面版发行配置（单一事实源：插件白名单 + 角色集 + 核心文件）
# 由 .github/workflows/publish-editions.yml 消费（打包 + Release 上传）；verify-edition-payload.sh 校验产物一致性。
edition: research-desktop
label: 科研桌面版
# 服务启用与禁用（edition 门控，deploy/editions/*.yaml 单一事实源）
# 桌面包裹版：关闭用户向 Web 服务（对应物理服务 verorun-main/8081 与 verorun-auth/8083）
services:
  user_login: false
  user_console: false
  main_site: false
# 许可证/订阅到期强制（agent_matrix.models.edition_requires_license() 消费）
# 2026-11-05 产品决策：科研桌面版商用分发，与金融桌面版同口径「订阅到期即锁」，
#   一律 fail-closed（未配置部署码/未知/过期均拒绝，不"默认放行+事后告警"）。
#   消费点：admin/app.py 的 _license_enforced()（锁 /admin 页面与插件业务端点）
#   与 agent_matrix/routes.py 的 _ai_license_enforced()（锁 AI/Agent 能力）。
#   激活入口为后端 /admin/renew（写入 system_config.deployment_code 后联网心跳）。
#   开发机自测：VERORUN_DEV_UNLICENSED=1 + 官方签名凭证（_official_dev_exempt），
#   客户仓库无 official_token.json(.sig) 时该豁免不成立。
license_enforcement: true
plugins:
  # 【2026-09-07 用户拍板】认知进化后端采用 memory_engine（服务端全量版），
  # 不使用 cogevolution_substrate；vault 保留。
  # （project_workspace 当时移出科研版，2026-10-26 用户裁决重新启用，见下方 include）
  # 【2026-09-08 用户拍板】content_factory / site_domains 对科研版毫无价值，移入 exclude。
  #
  # 运行时可见性（2026-11-05 对齐金融版）：声明 runtime_whitelist: true，让 include
  #   兼任运行期白名单。此前未声明（= false），运行时可见集由 plugin_distribution_rules
  #   + 各插件 compatible_editions 决定；标准安装包因发包已物理裁剪而不发作，但开发模式
  #   （壳层 codeDir 直指核心仓源码，plugins/ 为全量目录）或整盒部署切 VR_EDITION=research
  #   时，插件中心会列出磁盘上全部插件。金融版 2026-09-21 即踩过该坑（实测列出 ~39 个）。
  #   声明后：插件中心 / discover / enable / unified 四处门控同源，只放行下方 include。
  runtime_whitelist: true
  include:
    - _base
    # 2026-10-20 用户裁决：新增 bayes_engine（贝叶斯推理插件 v1.0.1）。
    #   依据：① 方法论同构——skills/research-belief-revision 为"竞争假设→实验证据→
    #   贝叶斯因子→信念修正"专门编写，补 method_architect（exp.hypothesis/methodology/
    #   validation）缺的"证据进来后如何定量更新信念"一环；② 归属零成本——agent_role=athena
    #   已在本版核心角色集内，resolve_agent_roles ① 直接命中，无需角色侧 managed_modules
    #   认领；③ compatible_editions=[] 全版本可见；④ 零运行时依赖（pure python，无 numpy），
    #   3 表 5 测试文件，min_app_version 0.63.0 与本版 kernel baseline 一致。
    - bayes_engine
    # 2026-10-22 用户裁决：补 chaos_engine + search_hub（与金融版对齐，符合官方
    #   compatible_editions 声明——二者均含 research）。业务依据：chaos_engine 非线性
    #   动力学/相空间/李雅普诺夫/分形/熵属科研方法论原语（method_architect 认领）；
    #   search_hub 通用检索→EvidenceBundle 为 lit_scout 文献检索补证据层（ops 认领）。
    #   运行时依赖 numpy 已在 prepare-runtime 全插件扫描闭包内（不按 edition 收敛），无需额外处理。
    - chaos_engine
    - search_hub
    # 2026-10-26 用户裁决：project_workspace 重新启用，定位「课题文档工作台」。
    #   依据：① 补位而非重叠——veroscholar 论文库只吃"检索回来的论文"（元数据+全文），
    #   不吃用户本地 docx/pptx/xlsx（数据表/组会 Slides/初稿），本插件填这一环；
    #   ② 零新开发——veroscholar kb_sync 双向通道代码早已建好，被 project_workspace_enabled()
    #   门控休眠，插件一启用即自动激活（论文入库/笔记/综述成稿 upsert 进 documents，
    #   论文问答经 hook project_workspace/search 挂项目知识）；
    #   ③ 归属显式——agent_role=content 不在本版角色集，改由 veroscholar 角色
    #   managed_modules 认领（科研 lane，同文件 roles 段 + 角色 yaml 同步登记）；
    #   ④ 备份闭环——存储目录改置 plugins/project_workspace/data/，vault 既有
    #   _add_plugin_data 约定（全量备份/按插件选择性备份/还原）自动覆盖，无 vault 代码改动；
    #   ⑤ 降级已设计——捆绑 PG 无 pgvector 时探测式建列，检索退关键词 tier；
    #   嵌入模型不可用同样退关键词（插件内建）。
    - project_workspace
    - captcha_embedded
    - email
    - memory_engine
    - vault
    - veroscholar
    # ★ 2026-11-05 用户裁决：net_proxy 必须接入 —— 境外文献源（arXiv / PubMed /
    #   Crossref / Web of Science）在境内部署下需经统一出站代理路由，否则检索不到。
    #   归属零成本：net_proxy.agent_role=ops 已在本版核心角色集内，resolve_agent_roles
    #   ① 直接命中，无需 ops.yaml managed_modules 认领。
    #   前置条件（已同步）：plugins/net_proxy/plugin.json 的 compatible_editions 追加 research。
    - net_proxy
    # ★ 2026-11-05 用户裁决：im_gateway 必须接入 —— 科研长任务（批量文献检索 / 综述
    #   生成 / 实验批处理）完成与异常需有 IM 即时通知通道，与 email 同级。
    #   归属：im_gateway.agent_role=service 不在本版核心角色集，由 roles/research-desktop/
    #   ops.yaml 的 managed_modules 显式认领（② 通道，与金融版 ops 认领 im_gateway 同惯例）。
    #   前置条件（已同步）：plugins/im_gateway/plugin.json 的 compatible_editions 追加 research。
    - im_gateway
  exclude:
    - cogevolution_substrate
    - content_factory
    - site_domains
    - shop
    - payment
    - subscription
    - coupons
    - logistics
    - wishlist
    - order_notify
    - reviews
    - ali_api
    - currency_converter
    - ads
    - social_push
    - enterprise_verify
    # 2026-10-20 用户裁决：科研单机版无短信验证 / 二次因子场景（user_login: false，
    #   session_service 对 two_factor_auth unavailable 有显式降级路径）；且二者在原
    #   include 内即无归属角色（agent_role=service 不在本版角色集，无 managed_modules
    #   认领，enable 必拒）——移入 exclude。email / vault 改由新增 ops 角色认领。
    - sms
    - two_factor_auth
roles:
  # 2026-10-20 用户裁决新增 ops（系统运维 lane：email 通知通道 + vault 备份/还原/
  #   审计），与金融版「平台通用 athena + ops」同构；其余为科研流水线角色。
  - athena
  - ops
  - veroscholar
  - lit_scout
  - method_architect
  - thesis_smith
  - peer_auditor
  - academic_writer
core_files:
  - agent_matrix/models.py
  - agent_matrix/routes.py
  - auth-center/models/database.py
  - auth-center/services/kb_permission.py
