# VeroRun 金融桌面版发行配置（单一事实源：插件白名单 + 角色集 + 核心文件）
# 由 .github/workflows/publish-editions.yml 消费（打包 + Release 上传）；verify-edition-payload.sh 校验产物一致性。
edition: finance-desktop
label: 金融桌面版
# 服务启用与禁用（edition 门控，deploy/editions/*.yaml 单一事实源）
# 桌面包裹版：关闭用户向 Web 服务（对应物理服务 verorun-main/8081 与 verorun-auth/8083）
services:
  user_login: false
  user_console: false
  main_site: false
# 许可证/订阅到期强制（agent_matrix.models.edition_requires_license() 消费）
# 2026-09-11 产品决策：桌面金融版「订阅到期即锁」，一律 fail-closed（未配置/未知/过期
# 均拒绝，不"默认放行+事后告警"）。其它发行版不写这一行 → 不启用（opt-in 语义）。
license_enforcement: true
plugins:
  # ── 设计定稿（2026-09-21）：include 只做「发包裁剪」，运行时可见性走动态分流规则 ──
  #
  #  ① 发包：include 决定哪些插件目录进安装包（stage-verorun-core.mjs / sync-to-pro.yml
  #      按它物理拷贝），故金融桌面版**包里只有这 10 项**（含 _base），不适用插件根本进不来。
  #      实测（2026-09-21）：staging 产物 8 个目录 = _base + 5 个业务插件 + data/_templates
  #      （非插件）；2026-10-01：加入 multi_asset 后为 _base + 7 个业务插件；同日再加入
  #      project_workspace、neural_flow 后，include 定稿为 _base + 9 个业务插件
  #      （ai_relay 属官方服务端能力，不进金融版发布包）。
  #      2026-10-06：加入 content_factory（资讯采集）后为 _base + 10 个业务插件。
  #      2026-10-12：加入 bayes_engine、butterfly_engine（用户裁决"两个插件都放行"：
  #      104 整盒 VR_EDITION 切 finance，二者 compatible_editions 分别为 [] 与
  #      ["finance"]，不登记进 include 则 enable 被 not_in_edition_include 拒、
  #      运行期不可见）后为 _base + 12 个业务插件。
  #      2026-10-13：加入 hr_recruit、visitor_profile、coupons（用户裁决：104 为测试机，
  #      所有插件都应能测到；本版角色与插件清单随业务增减，非固定量）后为
  #      _base + 15 个业务插件。
  #      2026-10-26：hr_recruit、visitor_profile 移出（用户裁决「金融版不需要这两个
  #      插件，毫无关系」）→ 发包为 _base + 15 个业务插件（含 coupons/search_hub/
  #      neural_flow）。只改本清单与 ops.yaml 认领，源码目录不动。
  #      2026-10-14：加入 chaos_engine（描述性混沌/非线性动力学风险原语，非交易信号；
  #      风控官 rs_risk 经 managed_modules 认领，plugin.json compatible_editions=["finance"]）
  #      后为 _base + 16 个业务插件。
  #      2026-10-26：neural_flow 重新入驻（v1.2.1 重构，UI 已接业务数据，下线根因
  #      已修复；用户裁决"插件已重构，重新加入金融版"）后为 _base + 17 个业务插件。
  #      2026-09-21：currency_converter（多币种）整插件移出 —— 本版无结算/换算场景，
  #      留着只是"设置页一张卡 + 一个无归属插件"。
  #      2026-10-01：multi_asset（多资产：期货/期权/基金/债券）移入 —— 其
  #      plugin.json 已声明 compatible_editions 含 finance，且其余 6 项均不提供
  #      多资产行情，缺它则本版"能力声明与发行载荷"自相矛盾。
  #   ② 运行时：★ 2026-10-06 决策变更 —— 声明 runtime_whitelist: true，让 include
  #      **兼任运行期白名单**。金融桌面版的插件集是**固定 12 个**（见下方 include），
  #      插件中心 / discover / enable / unified 四处门控同源，只放行这 12 个；包外插件
  #      （ads / shop / site_builder …）不出现在列表、不可启用。
  #      代价（显式接受）：商店新上架的适用插件若不在 include 中即不可见，需随发行版
  #      一起更新本清单；换来的是"界面所见 == 本版固定插件集"。
  #      历史：2026-09-21 曾用 runtime_whitelist: false 走「默认放行 + 显式隐藏」，
  #      但本版 plugin_distribution_rules 表为空 → 运行期隐藏集只剩 exclude，插件中心
  #      实测列出磁盘上全部 ~39 个插件（用户报告"未裁剪为 9 个固定插件"）。
  #   ③ （保留路径）"本版不适用"亦可用 plugin_distribution_rules 表达（与商店准入共用
  #      distribution.resolve_visible_set）；本版该表当前为空，不参与判定。
  #
  #   health_check：不在 include（不进包），现已由上述 include 白名单在运行期隐藏 ——
  #   单机桌面版（Windows / macOS）无巡检意义。它与服务端 health_service(8085) 无关
  #   （后者是核心组件，不依赖本插件），但其定时巡检任务在本版不再注册，此为预期。
  runtime_whitelist: true
  include:
    - _base
    - stock_analysis
    - multi_asset
    - im_gateway
    - email
    - memory_engine
    - bayes_engine
    - butterfly_engine
    - chaos_engine
    - vault
    - net_proxy
    - project_workspace
    # 2026-10-22：neural_flow（神经中枢）整模块下线 —— 事件流仅有心跳、前端页面自承
    # 未接入业务埋点（用户裁决清理），故从本版 include 移除，为 _base + 16 个业务插件。
    - content_factory
    # 2026-10-13 用户裁决：104 为测试机，「所有插件都应该能测到」；金融版角色与插件
    # 清单随业务增减、不是固定量。放行以下项以在 104 管理端可测（归属走下方
    # roles/finance-desktop/ops.yaml 的 managed_modules 认领通道，与 email /
    # im_gateway / content_factory / project_workspace 同一既有惯例，
    # 见 agent_matrix/models.py resolve_agent_roles ②）：
    #   coupons         智能优惠券（奖励规则页 bridge 依赖，本版由 ops 认领）
    - coupons
    # ★ 2026-10-26 用户裁决：hr_recruit（招聘管理）、visitor_profile（访客画像）
    #   「金融版不需要这两个插件，毫无关系」→ 从本版 include 移除。
    #   落点纪律：只改门控层（本文件 include + ops.yaml managed_modules + 配套测试
    #   期望集），**plugins/hr_recruit、plugins/visitor_profile 源码目录一字不动**，
    #   它们仍在 omni / minipro 等版本正常提供（omni-desktop/omni-service 的 include
    #   仍列 visitor_profile）。
    #   移除后行为：discovery 仍会扫到磁盘目录，但 runtime_whitelist: true 的 include
    #   即运行期白名单 → 二者进入隐藏集，且 manager.init_app() 的版侧收口
    #   （_converge_excluded_rows）会把注册表里残留的 error 状态收敛为
    #   disabled(not_in_edition_include)，不再计入 /health 的 plugins_error；
    #   hr_recruit 的 "License required: no_license" 与 visitor_profile 的
    #   "$libdir/vector 缺失" 两条常驻 error 随之消失。
    # 2026-10-18：search_hub 通用检索接入层（agent_role=content，本版由 ops 认领，
    # 走下方 ops.yaml managed_modules 通道）。今日唯一保留项。
    - search_hub
    # 2026-10-26：neural_flow（神经中枢）重新入驻 —— v1.2.1 重构后 UI 已落地
    # （执行流 / 实时流 / 领域档案三页签；8084 partial include 与菜单别名早已就位）。
    # 2026-10-22 下线理由「事件流仅有心跳 + 页面未接业务埋点」已由 v1.2.0 双源采集
    # （agent_token_logs / agent_tasks）+ 内核 task_id 透传 + obs_* 归并视图解决。
    # 归属：agent_role=ops 命中本版核心角色集（① 通道），不改角色 YAML。
    - neural_flow
  # ⚠️ 运行时无效（勿依赖）：agent_matrix.models.edition_plugin_excludes() 已废弃、恒返回
  #   空列表 —— 插件可见性现由各插件 plugin.json 的 compatible_editions 决定。
  #   本段保留仅作"本版明确不提供"的登记与发包侧参考；**实际运行时闸门是上面的 include**。
  #   若将来要恢复黑名单语义，须先改 edition_plugin_excludes()，否则这里写了也不会生效。
  exclude:
    - veroscholar
    # hr_recruit / visitor_profile：2026-10-13 曾移出本表改列入上方 include（104 测试机
    # 要测到它们）；**2026-10-26 用户裁决金融版不需要，已从 include 移除**，且不再回填
    # 本表 —— 本段运行期恒无效（见上方 ⚠️），把它们写在这里只会制造"已登记排除"的
    # 假安全感；真正的闸门是 include 缺失 → 运行期隐藏集 + 版侧收口置 disabled。
    # 历史留档：hr_recruit 的 agent_role=office 在 agent_matrix/roles/09-office.yaml
    # 声明 editions:[official]，金融版角色集过滤后 discovery 的「agent_role 须为核心角色」
    # 校验会失败，当年靠 roles/finance-desktop/ops.yaml 的 managed_modules 认领
    # （resolve_agent_roles ②）绕过；2026-10-26 该认领亦已同步删除。
    # cogevolution_substrate：物联网（边缘）场景的认知进化，金融桌面版不适用。
    # 当前核心仓库尚未收录该插件目录，此处先登记 —— 将来它若被同步进仓库，
    # 打包与门控会自动排除，无需再想起来处理（源中不存在时打包断言亦容忍）。
    - cogevolution_substrate
roles:
  # 投研版角色排班 —— 恢复 2026-09-07 e6da88d8「落地投研版角色编排」的原始裁决，并按
  # 「插件 / 版本 / 桌面环境 / 行业惯例」四条依据定稿（2026-09-21）：
  #   · 投研流水线（行业惯例 = 卖方/买方投研分工）：rs_planner(规划) → rs_fundamental
  #     (基本面) / rs_quant(量价·数据) → rs_risk(反方风控) → rs_pm(组合决策) → rs_compliance(合规)
  #   · 平台通用：athena(编排 Master)、ops(系统运维：备份/健康/告警通道) —— 桌面单机版必需
  #   · 移出 finance：其主题为"订阅/计费/订单/支付/发票"，桌面单机版 services 全关、
  #     无 subscription/payment/order_notify 插件（原始裁决与 plugin-standard-v1.8 §2.2
  #     亦将 finance 归官方版）
  - athena
  - ops
  - rs_planner
  - rs_fundamental
  - rs_quant
  - rs_risk
  - rs_pm
  - rs_compliance
core_files:
  - agent_matrix/models.py
  - agent_matrix/routes.py
  - auth-center/models/database.py
  - auth-center/services/kb_permission.py
