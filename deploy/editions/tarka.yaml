# 塔卡投研（tarka.cn）发行配置 —— 单一事实源：插件白名单 + 服务开关
#
# 命名说明（2026-11-01 用户裁决）：不用 "standard" 作为本发行版名称。
# "standard" 会与发布仓库 fanjumin/verorun-standard 混淆（该仓库承载全部 edition 资产，
# 不是某个发行版的代号）。因此本发行版独立为 edition=tarka，产物名 tarka.yaml。
# 兼容口径：tarka 部署下，plugin.json 中声明 "standard" 的插件同样放行
# （见 shared/edition.py::_EDITION_COMPAT_UNION），故 42 个插件的兼容声明无需逐个改写。
#
# 「25 插件 → 网站功能映射」（Web 呈现层 13 + 能力层 14，二者重叠 content_factory /
# subscription，去重后 25 个）。本清单在此基础上补两项闭包/基建：
#   _base          —— 基础插件，与其它 edition 同惯例（finance-desktop/minipro/omni 均含）
#   oauth_config   —— 依赖闭包：mini_app_builder 的 dependencies 要求 oauth_config>=1.0.0
edition: tarka
label: 塔卡投研
services:
  # tarka.cn 官网 + 账户中心 + 订购/授权均在服务器侧提供，故三项全开
  user_login: true
  user_console: true
  main_site: true
plugins:
  # 2026-11-10 用户裁决：tarka.cn 不再使用运行期白名单。
  # include 仅保留「发包裁剪」职责（sync 流程按它物理拷贝插件目录）；
  # 运行期可见性 / 安装 / 启用回到插件自身 compatible_editions 判定。
  # 副作用范围（服务器实测 28 个插件目录）：仅 social_push 因此从「不可见不可装」
  # 转为可装；stock_analysis 仍被其 compatible_editions（无 standard）挡在 tarka 外。
  # ⚠️ 位置必须在 include 之前：agent_matrix.models._parse_edition_plugin_lists 只在
  #    plugins: 段的标量位置识别该键，写在 include 项之后会被归入 include 段而静默
  #    失效（回落默认 true，实测 2026-11-10）。
  runtime_whitelist: false
  # include 兼任两职（语义见 agent_matrix/models.edition_runtime_whitelist）：
  #   ① 发包裁剪：sync 流程按它物理拷贝插件目录；
  #   ② 运行时门控：plugin_manager 的可见性 / 安装 / 启用三层同口径。
  include:
    - _base
    - oauth_config
    # 注册/登录防刷：滑块验证码（2026-11-09 修复 P0-01；此前不在 tarka 白名单，
    # 插件路由被 PluginManager 门卫统一拦截为 404）
    - captcha_embedded
    # ── Web 呈现层（13）──
    - site_builder
    - chatbot
    - search_hub
    - project_workspace
    - wishlist
    - survey
    - coupons
    # shop 已于 2026-11-03 移除：coupons v1.5.5 解除 order_items 硬绑定（优雅降级），
    # 无商城 edition 不再需要 shop；此前补入系 coupons 未声明隐式依赖的临时兜底。
    # 2026-11-09 用户裁决「shop、1688 等都应作为商务中心」：tarka 重新纳入 shop 与 ali_api，
    # 用于桌面「商务中心」的商品管理 / 1688 选品上架；coupons→order_items 仍走优雅降级，不构成硬依赖。
    - shop
    - ali_api
    - hr_recruit
    - ads
    - mini_app_builder
    - omni_service
    - content_factory
    - subscription
    # ── 能力层（14，含与 Web 层重叠的 content_factory / subscription）──
    - ai_relay
    - analytics
    - email
    - enterprise_verify
    - health_check
    - im_gateway
    - memory_engine
    - payment
    - site_domains
    - sms
    - vault
    - visitor_profile
